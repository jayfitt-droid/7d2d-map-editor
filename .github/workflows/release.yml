name: release

# Push a tag such as v1.0.0 to build the installer and publish a GitHub release with the Velopack update feed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and pack
        shell: pwsh
        run: ./build/release.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/releases/*
          generate_release_notes: true
