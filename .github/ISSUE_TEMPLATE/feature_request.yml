name: Feature request
description: An idea for a new tool, setting or change.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
      description: The result you want in your world, not only the button you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: The steps or workaround you use now, if any.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How the editor could do it. Screenshots or sketches help.
